[project]
name = "motivation-pattern-log-scripts"
version = "0.1.0"
description = "Automation scripts for the motivation-pattern-log practice"
requires-python = ">=3.13"
dependencies = [
    # Locked at v0.4.0 implementation. Listed here so the structure is visible.
    "feedparser>=6.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

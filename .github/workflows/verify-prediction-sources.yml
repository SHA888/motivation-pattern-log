name: verify-prediction-sources

on:
  pull_request:
    paths:
      - 'predictions/PREDICTION-*.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: scripts
        run: uv sync --locked

      - name: Find changed prediction files
        id: changed
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          files=$(git diff --name-only --diff-filter=ACM \
            "${{ github.event.pull_request.base.sha }}" HEAD -- 'predictions/PREDICTION-*.md')
          {
            echo "files<<FILES_EOF"
            echo "$files"
            echo "FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify claim-level sourcing
        if: steps.changed.outputs.files != ''
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          status=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::Verifying $f"
            uv run verify_prediction_sources.py "../$f" || status=1
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.files }}"
          exit $status
